:root{--bg:#f3f7fb;--panel:#fff;--fg:#1d2733;--muted:#62707f;--line:#d3e0ec;--g:#2a6f97;--g-l:#e1eef7;--ok:#1f8a4c;--ko:#b3261e;--c:#2a6f97;--L:#b8434c;--M:#b7791f;--T:#2a6f97;--A:#2e7d4f}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111820;--panel:#1a2430;--fg:#e8f0f7;--muted:#a7b6c4;--line:#2d3f50;--g:#74b9e4;--g-l:#223344;--ok:#4cc58a;--ko:#ff9a9a;--c:#74b9e4;--L:#ee8a92;--M:#e3b45e;--T:#74b9e4;--A:#5fc08a}}
:root[data-theme=dark]{--bg:#111820;--panel:#1a2430;--fg:#e8f0f7;--muted:#a7b6c4;--line:#2d3f50;--g:#74b9e4;--g-l:#223344;--ok:#4cc58a;--ko:#ff9a9a;--c:#74b9e4;--L:#ee8a92;--M:#e3b45e;--T:#74b9e4;--A:#5fc08a;color-scheme:dark}
:root[data-theme=dark] .op.good{background:#1f4a33;color:#d3f0de}:root[data-theme=dark] .op.bad{background:#552422;color:#fbdcda}
.btn:disabled{opacity:.45;cursor:default}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'AccesScript',system-ui,sans-serif;font-size:20px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px}
h1{font-size:24px;margin:0;color:var(--g)}.sub{font-size:16px;color:var(--muted)}
.seg{display:inline-flex;border:2px solid var(--g);border-radius:14px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:8px 16px}.seg button[aria-pressed=true]{background:var(--g);color:#fff}
.btn{border:2px solid var(--g);background:var(--g);color:#fff;border-radius:12px;padding:8px 14px}
.btn.ghost{background:var(--panel);color:var(--g)}.btn.small{padding:4px 10px;font-size:18px}
.app{display:grid;grid-template-columns:320px 1fr;gap:14px;padding:0 16px 24px;align-items:start}
.chs{display:flex;flex-direction:column;gap:5px;max-height:calc(100vh - 90px);overflow:auto;position:sticky;top:8px}
.flt{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}.flt button{border:2px solid var(--line);background:var(--panel);border-radius:20px;padding:2px 10px;font-size:15px}.flt button[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff}
.chs .cb{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 10px;font-size:17px;line-height:1.1;border-left:8px solid var(--dc)}
.chs .cb .cd{background:var(--dc);color:#fff;border-radius:7px;padding:1px 9px;font-weight:700}
.chs .cb .ok{margin-left:auto;color:var(--ok);font-weight:800}
.chs .cb[aria-current=true]{border-color:var(--dc);background:var(--g-l);font-weight:700}
.board{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px;min-width:0}
.sbar{flex-wrap:wrap;background:var(--g-l);border:2px solid var(--dc);border-radius:12px;padding:6px 14px;font-weight:700;display:flex;gap:10px;align-items:center}
.sbar .code{background:var(--dc);color:#fff;border-radius:8px;padding:0 10px}
.chip{font-size:14px;border-radius:12px;padding:0 8px;background:var(--dc);color:#fff;font-weight:600}
.cons{margin:8px 2px}.cons b{color:var(--g)}
.lvl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.lvl button{border:3px solid var(--g);background:var(--panel);border-radius:10px;min-width:44px;padding:2px 10px}
.lvl button[aria-pressed=true]{background:var(--g);color:#fff}.lvl button.done{box-shadow:inset 0 -5px 0 var(--ok)}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.it .l{font-size:26px;font-weight:700;color:var(--dc)}
.it .q{font-size:26px;line-height:1.3}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.op{border:3px solid var(--g);background:var(--panel);border-radius:12px;padding:6px 14px;font-size:22px}
.op.sel{background:var(--g-l);box-shadow:0 0 0 3px var(--g) inset}.op.good{background:#d3f0de;border-color:var(--ok);color:#0b5a2d}.op.bad{background:#fbdcda;border-color:var(--ko);color:#7a1511}.op.was{border-style:dashed;border-color:var(--ok)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .op.good{background:#1f4a33;color:#d3f0de}:root:not([data-theme=light]) .op.bad{background:#552422;color:#fbdcda}}
.badge{font-size:34px;font-weight:800}.badge.ok{color:var(--ok)}.badge.ko{color:var(--ko)}
.spk{border:0;background:transparent;font-size:24px;padding:0 6px;vertical-align:middle}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}
.note{margin-top:10px;border:2px dashed var(--line);border-radius:12px;padding:6px 12px;font-size:16px;color:var(--muted)}
.lesson{border:4px solid var(--dc);border-radius:18px;padding:16px 22px 20px;background:var(--panel);font-size:1.4em;line-height:1.5;margin:8px 0}
.lesson .lt{font-weight:900;color:var(--dc);font-size:1.1em;margin-bottom:8px}.lesson .lt .code{background:var(--dc);color:#fff;border-radius:8px;padding:0 10px}
.lk{display:block;font-size:.55em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin-bottom:2px}
.lesson .lq{background:color-mix(in srgb,var(--dc) 12%,var(--panel));border-radius:14px;padding:10px 16px;margin-bottom:12px}
.lesson .lxs{border-left:5px solid var(--dc);padding-left:16px;margin-bottom:12px}.lesson .lxi{margin:4px 0}
.lesson .ltip{font-size:.85em;font-weight:700;color:var(--g);margin-bottom:6px}
.lesson .lact{font-size:.8em;background:var(--g-l);border-radius:12px;padding:6px 12px}
.lesson a{color:var(--g);font-weight:700}
.deck{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px}
.card{width:min(520px,92%);min-height:300px;border:4px solid var(--dc);border-radius:24px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer;perspective:800px;user-select:none}
.card .em{font-size:110px;line-height:1.1}.card .wd{font-size:40px;font-weight:800;color:var(--dc)}.card .df{font-size:28px;margin-top:8px;line-height:1.35}
.card .hint{font-size:16px;color:var(--muted);margin-top:8px}
.cnt{font-size:18px;color:var(--muted)}
.mdl .step{background:var(--g-l);border-radius:12px;padding:6px 12px;font-size:18px;margin-top:6px}
body.focus header,body.focus .chs,body.focus .sbar,body.focus .lvl,body.focus .note{display:none}body.focus .app{grid-template-columns:1fr}
@media(max-width:860px){.app{grid-template-columns:1fr}.chs{position:static;max-height:none;flex-direction:row;flex-wrap:nowrap;overflow-x:auto}.chs .cb{flex:none}.flt{display:none}.it{grid-template-columns:1fr}.op{font-size:20px}}
.ic{display:block}.vis{margin:8px 0;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;display:inline-block;max-width:100%;overflow-x:auto}
.big{line-height:1}.row{display:flex;gap:10px}.code{font-size:1.15em;letter-spacing:3px;background:var(--g-l);border-radius:8px;padding:0 8px}
.eg{display:inline-grid;gap:4px;background:#fff;color:#222}.ec,.el{display:flex;align-items:center;justify-content:center;width:58px;height:58px;font-size:34px;border:2px solid #9ab;border-radius:6px}.ec b{font-size:30px;color:#b8434c}.el{border:0;font-size:24px;font-weight:800;width:auto;color:#2a6f97}
.opts .op svg{display:block}.opts .op{display:flex;align-items:center;gap:6px}
.col{display:flex;flex-direction:column;align-items:center;gap:2px}.big2{font-size:34px;display:inline-block;margin:4px 0}.opts .op span{font-size:20px}.tow{display:flex;flex-direction:column;align-items:center}.tow .ic{margin:-6px 0}
.drawbox{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px}.mod{background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px}.mod .lk{color:#62707f}
.it .side{display:flex;flex-direction:column;gap:6px;align-items:center}
.uibox{margin:6px 0}.tray{border:3px solid var(--line);background:#fff;border-radius:12px;padding:3px 6px;margin:3px;position:relative;cursor:pointer}.tray:active{transform:scale(.96)}.tray .n{position:absolute;top:-8px;right:-6px;background:var(--g);color:#fff;border-radius:50%;min-width:24px;height:24px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center}.mine{min-height:70px;border:3px dashed var(--line);border-radius:12px;padding:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:var(--g-l)}.tot{font-size:30px;font-weight:800;margin:4px 0}.ckn{cursor:pointer}.ckn:hover circle{fill:#2a6f9733}@media(max-width:860px){.chs{flex-wrap:wrap!important;overflow:visible!important;gap:6px}.chs .cb{padding:4px 8px!important;gap:0!important;flex:none}.chs .cb>span:not(.cd):not(.ok){display:none}.chs .cb .cd{font-size:18px;padding:2px 10px}.chs .grp{display:none}}
</style></head><body>
